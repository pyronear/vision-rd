[project]
name = "calibration-sensitivity"
version = "0.1.0"
description = "Calibration sensitivity on synthetic profiles and real mast terrain"
requires-python = ">=3.11"
dependencies = [
    "smoke-localisation",
    "numpy==2.4.6",
    "pyproj==3.7.2",
    "rasterio==1.4.4",
    "scipy==1.17.1",
    "ncnn==1.0.20260114",
    "opencv-python-headless==4.13.0.92",
    "pyyaml>=6,<7",
]

[tool.uv]
required-version = ">=0.13.4,<1.0.0"
# NCNN requests the GUI build; the headless package supplies the same cv2 module.
exclude-dependencies = ["opencv-python"]

[tool.uv.sources]
smoke-localisation = { git = "https://github.com/pyronear/smoke-localization", rev = "5f578f126f8c8f5933a78c8a85a3cb9c1260915d" }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9", "dvc[s3]>=3.56"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
