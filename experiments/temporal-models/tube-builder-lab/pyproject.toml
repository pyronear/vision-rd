[project]
name = "tube-builder-lab"
version = "0.1.0"
description = "Visual lab to iterate on the bbox-tube linking algorithm (current vs candidate)"
requires-python = ">=3.11"
dependencies = [
    "bbox-tube-temporal-core",
    "pyrocore",
    "requests>=2.31",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "pandas>=2.0",
    "altair>=5.0",
    "streamlit>=1.40",
]

[tool.uv.sources]
bbox-tube-temporal-core = { path = "../../../lib/bbox-tube-temporal" }
pyrocore = { path = "../../../lib/pyrocore" }

[dependency-groups]
dev = [
    "dvc[s3]>=3.56",
    "nbqa>=1.9",
    "nbstripout>=0.8",
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tube_builder_lab"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
