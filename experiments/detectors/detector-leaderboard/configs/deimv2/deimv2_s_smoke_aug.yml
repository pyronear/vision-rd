__include__: ['./deimv2_s_smoke.yml']

# The winning approach is full-frame 640 (deimv2-s, F1 0.864). This repeats that
# EXACT setup — full-frame rfdetr_coco data, 640, 132 epochs, EMA (all inherited) —
# but swaps in the tiled run's augmentations, especially hard-negative fp-crop
# injection (FPInject) and copy-mode smoke context injection (CopyBlend). Isolates
# the augmentation effect on the full-frame model. Inference stays full-frame
# (scripts/infer_deimv2.py), like the original.
output_dir: ./outputs/deimv2_s_smoke_aug
checkpoint_freq: 1   # save every epoch -> resume after an external kill loses <=1 epoch

train_dataloader:
  num_workers: 2
  dataset:
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 20, random_pop: True}
        - {type: RandomPhotometricDistort, brightness: [0.9, 1.1], contrast: [0.9, 1.1],
           saturation: [0.9, 1.1], hue: [0.0, 0.0], p: 0.5}
        - {type: RandomGaussianBlur, kernel_size: 5, sigma: [0.1, 2.0], p: 0.3}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: FPInject, crop_dir: /home/rsortino/projects/other/vision-rd/.claude/worktrees/detector/experiments/detectors/detector-leaderboard/data/05_model_input/fp_crops/train,
           prob: 0.5, max_objects: 3, min_scale: 0.6, max_scale: 1.2}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomGaussianBlur', 'RandomZoomOut',
              'RandomIoUCrop', 'FPInject']
        epoch: [4, 64, 120]   # stock 132-epoch schedule (matches original deimv2-s)
  collate_fn:
    mixup_prob: 0.0
    copyblend_prob: 0.5
    copyblend_type: 'copy'
    copyblend_epochs: [4, 120]
    with_expand: True
    expand_ratios: [0.1, 0.25]
    area_threshold: 50
    num_objects: 3
    stop_epoch: 120
