name: Set up uv
description: Install the lowest uv version allowed by the selected project.
inputs:
  project-file:
    description: Project pyproject.toml that defines tool.uv.required-version.
    required: true
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      with:
        version-file: ${{ inputs.project-file }}
        resolution-strategy: lowest
