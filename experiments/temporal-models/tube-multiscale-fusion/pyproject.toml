[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tube_multiscale_fusion"]

[project]
name = "tube-multiscale-fusion"
version = "0.1.0"
description = "Two-branch temporal smoke classifier: global DINOv2 sequence context + local spatio-temporal tube transformer, fused via cross-attention"
requires-python = ">=3.11"
dependencies = [
    "pyrocore",
    "bbox-tube-temporal-core",
    "lightning>=2.2",
    "matplotlib>=3.8",
    "numpy>=1.26,<2",
    # Serving-path detector companion (tube_multiscale_fusion.model / package):
    # ultralytics is imported directly; opencv-python-headless pins the cv2
    # build that loads in headless envs (full opencv-python fails on libGL).
    "ultralytics>=8.3",
    "opencv-python-headless>=4.8",
    "pyyaml>=6.0",
    "scikit-learn>=1.4",
    "tensorboard>=2.16",
    "timm>=1.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "tqdm>=4.66",
    "huggingface-hub>=0.24",
]

[tool.uv.sources]
pyrocore = { path = "../../../lib/pyrocore" }
bbox-tube-temporal-core = { path = "../../../lib/bbox-tube-temporal" }

[dependency-groups]
dev = [
    "dvc[s3]>=3.56",
    "jupyterlab>=4.0",
    "nbqa>=1.9",
    "nbstripout>=0.8",
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PLC0415"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
markers = [
    "slow: tests that download large model weights (deselect with -m 'not slow')",
]
