[project]
name = "camera-pose-alignment"
version = "0.1.0"
description = "Characterize PTZ camera pose misalignment over time (issue #89)"
requires-python = ">=3.11"
dependencies = [
    "datasets>=3.0",
    "matplotlib>=3.9",
    "numpy>=2.0",
    "opencv-python-headless>=4.10",
    "pandas>=2.2",
    "pillow>=10.4",
]

[tool.uv]
required-version = ">=0.13.4,<1.0.0"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/camera_pose_alignment"]
