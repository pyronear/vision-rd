[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bbox_tube_temporal"]

[project]
name = "bbox-tube-temporal-core"
version = "0.1.0"
description = "Inference core for the bbox-tube temporal smoke classifier (mirror copy of the experiment's serving-path modules)"
requires-python = ">=3.11"
dependencies = [
    "pyrocore",
    "numpy>=1.26,<2",
    "pillow>=10.0",
    "pydantic>=2.6",
    "pyyaml>=6.0",
    "timm>=1.0",
    "torch>=2.2",
    "torchvision>=0.17",
    "ultralytics>=8.3",
]

[tool.uv.sources]
pyrocore = { path = "../pyrocore" }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
