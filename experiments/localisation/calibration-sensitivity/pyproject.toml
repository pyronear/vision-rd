[project]
name = "calibration-sensitivity"
version = "0.1.0"
description = "Calibration sensitivity on synthetic profiles and real mast terrain"
requires-python = ">=3.11"
dependencies = [
    "smoke-localisation",
    "numpy==2.4.6",
    "pyproj==3.7.2",
    "rasterio==1.4.4",
    "scipy==1.17.1",
]

[tool.uv]
required-version = ">=0.13.4,<1.0.0"

[tool.uv.sources]
smoke-localisation = { git = "https://github.com/pyronear/smoke-localization", rev = "cf2bfdecbfbefafb6dfdc7ec8f505d9b6bffab5d" }

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.9"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "PLC0415"]

[tool.ruff.format]
quote-style = "double"
