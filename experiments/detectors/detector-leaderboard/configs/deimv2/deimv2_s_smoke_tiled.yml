__include__: ['./deimv2_s_smoke.yml']

# DEIMv2-S trained on native-resolution 640 tiles (data/05_model_input/tiled_coco),
# with the requested augmentations: tile-Mosaic (2x2), constrained color jitter
# (no hue), gaussian blur p=0.3, smoke context injection (CopyBlend, adds boxes),
# and hard-negative fp-crop injection (FPInject, adds NO boxes). Inference is tiled
# + merged (infer_sahi_deimv2.py). epoches lowered since the tiled set is ~9x larger.
output_dir: ./outputs/deimv2_s_smoke_tiled
epoches: 24
checkpoint_freq: 1   # save every epoch so a resume after an external kill loses <=1 epoch

train_dataloader:
  total_batch_size: 16
  num_workers: 2
  dataset:
    img_folder: /home/rsortino/projects/other/vision-rd/.claude/worktrees/detector/experiments/detectors/detector-leaderboard/data/05_model_input/tiled_coco/train
    ann_file: /home/rsortino/projects/other/vision-rd/.claude/worktrees/detector/experiments/detectors/detector-leaderboard/data/05_model_input/tiled_coco/train/_annotations.coco.json
    transforms:
      ops:
        - {type: Mosaic, output_size: 320, rotation_range: 10, translation_range: [0.1, 0.1], scaling_range: [0.5, 1.5],
           probability: 1.0, fill_value: 0, use_cache: True, max_cached_images: 20, random_pop: True}
        # Color jitter: luminance/contrast/saturation only, NO hue, small ranges.
        - {type: RandomPhotometricDistort, brightness: [0.9, 1.1], contrast: [0.9, 1.1],
           saturation: [0.9, 1.1], hue: [0.0, 0.0], p: 0.5}
        - {type: RandomGaussianBlur, kernel_size: 5, sigma: [0.1, 2.0], p: 0.3}
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: Resize, size: [640, 640], }
        - {type: SanitizeBoundingBoxes, min_size: 1}
        # Hard-negative false-positive distractors (no boxes added).
        - {type: FPInject, crop_dir: /home/rsortino/projects/other/vision-rd/.claude/worktrees/detector/experiments/detectors/detector-leaderboard/data/05_model_input/fp_crops/train,
           prob: 0.5, max_objects: 3, min_scale: 0.6, max_scale: 1.2}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: Normalize, mean: [0.485, 0.456, 0.406], std: [0.229, 0.224, 0.225]}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        name: stop_epoch
        ops: ['Mosaic', 'RandomPhotometricDistort', 'RandomGaussianBlur', 'RandomZoomOut',
              'RandomIoUCrop', 'FPInject']
        epoch: [2, 12, 22]   # [no-aug warmup, mosaic on, mosaic off, no-aug tail]
  collate_fn:
    # Smoke context injection: crop in-batch GT boxes (+context) and paste them.
    mixup_prob: 0.0
    copyblend_prob: 0.5
    copyblend_type: 'copy'
    copyblend_epochs: [2, 22]
    with_expand: True
    expand_ratios: [0.1, 0.25]
    area_threshold: 50
    num_objects: 3
    stop_epoch: 22

val_dataloader:
  total_batch_size: 16
  num_workers: 2
  dataset:
    img_folder: /home/rsortino/projects/other/vision-rd/.claude/worktrees/detector/experiments/detectors/detector-leaderboard/data/05_model_input/tiled_coco/valid
    ann_file: /home/rsortino/projects/other/vision-rd/.claude/worktrees/detector/experiments/detectors/detector-leaderboard/data/05_model_input/tiled_coco/valid/_annotations.coco.json
